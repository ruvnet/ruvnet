name: Refresh registry metrics and visuals

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: write

concurrency:
  group: refresh-registry-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recount crates.io and npm, render and validate
        run: python3 scripts/refresh-registry-metrics.py
      - name: Commit refreshed metrics
        shell: bash
        run: |
          if git diff --quiet && [ -f data/registry-stats.json ]; then
            echo "No metric changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ruvnet-packages.md data/metrics.json data/registry-stats.json data/snapshots assets/ruvnet
          git commit -m "refresh npm and crates.io download metrics"
          git push
