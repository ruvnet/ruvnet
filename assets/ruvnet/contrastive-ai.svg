<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">rUv contrastive AI walkthrough</title>
<desc id="desc">Conceptual illustration of the ruvnet approach. Related observations move closer, mismatches move apart, and a constraint gate separates candidate updates from retained memory. This is not benchmark evidence.</desc>
<defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#163047" stroke-opacity=".45"/></pattern></defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.flow{stroke-dasharray:5 12;animation:flow 3s linear infinite}
.near{animation:near 12s ease-in-out infinite}
.far{animation:far 12s ease-in-out infinite}
.gate{animation:glow 12s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-85}}
@keyframes near{0%,5%,100%{transform:translateX(0)}25%,90%{transform:translateX(50px)}}
@keyframes far{0%,33%,100%{transform:translateX(0)}58%,90%{transform:translateX(25px)}}
@keyframes glow{0%,65%,100%{stroke:#659c8e;stroke-width:2}72%,92%{stroke:#9de8d0;stroke-width:4}}
.stage{fill:none;stroke-width:2;opacity:0;animation:stage 12s linear infinite}
.second{animation-delay:4s}.third{animation-delay:8s}
.caption{opacity:0;animation:caption 12s linear infinite}
@keyframes stage{0%,29%{opacity:1}33%,100%{opacity:0}}
@keyframes caption{0%,29%{opacity:1}33%,100%{opacity:0}}
.track{stroke-dasharray:280;stroke-dashoffset:280;animation:progress 12s linear infinite}
@keyframes progress{0%{stroke-dashoffset:280}33%,95%{stroke-dashoffset:0}100%{stroke-dashoffset:280}}
.packet{opacity:0;animation:packet 12s linear infinite}
@keyframes packet{0%,27%{opacity:0;transform:translateX(0)}29%{opacity:1;transform:translateX(0)}33%{opacity:1;transform:translateX(48px)}34%,100%{opacity:0;transform:translateX(48px)}}
.packet.second{animation-delay:4s}
.retained{opacity:.25;animation:retained 12s linear infinite}
@keyframes retained{0%,70%,100%{opacity:.25}78%,94%{opacity:1}}

@media(prefers-reduced-motion:reduce){*{animation:none!important}.caption,.packet,.stage{display:none}.retained{opacity:1}.near{transform:translateX(50px)}.far{transform:translateX(25px)}}
</style>
<rect width="1000" height="330" rx="16" fill="#080e19"/><rect width="1000" height="280" rx="16" fill="url(#grid)"/>
<text x="28" y="34" fill="#edf3ff" font-size="18">rUv / CONTRASTIVE AI WALKTHROUGH</text>
<text x="28" y="58" fill="#a7b8ce" font-size="12">A 12 second learning loop: compare observations, separate mismatches, check updates.</text>
<g fill="#0d1726" stroke="#263b52"><rect x="28" y="80" width="280" height="165" rx="12"/><rect x="360" y="80" width="280" height="165" rx="12"/><rect x="692" y="80" width="280" height="165" rx="12"/></g>
<text x="48" y="108" fill="#9de8d0" font-size="15">01 / SIMILARITY</text>
<path d="M90 162H218" stroke="#9de8d0" stroke-opacity=".3"/>
<g class="near" fill="#9de8d0"><circle cx="90" cy="154" r="9"/><circle cx="108" cy="177" r="6"/><circle cx="72" cy="173" r="5"/></g>
<g fill="#a5b5ff"><circle cx="206" cy="155" r="9"/><circle cx="226" cy="176" r="6"/><circle cx="190" cy="177" r="5"/></g>
<text x="48" y="224" fill="#a7b8ce" font-size="12">Related observations converge</text>
<text x="380" y="108" fill="#a5b5ff" font-size="15">02 / SEPARATION</text>
<g fill="#9de8d0"><circle cx="420" cy="156" r="8"/><circle cx="439" cy="177" r="6"/><circle cx="407" cy="179" r="5"/></g>
<g class="far" fill="#f6a675"><circle cx="555" cy="156" r="8"/><circle cx="570" cy="176" r="6"/></g>
<path class="flow" d="M465 165H534" stroke="#a5b5ff"/>
<text x="380" y="224" fill="#a7b8ce" font-size="12">Mismatches remain distinct</text>
<text x="712" y="108" fill="#f6a675" font-size="15">03 / STRUCTURAL CHECKS</text>
<path class="flow" d="M726 166H802M850 166H937" stroke="#9de8d0"/>
<path class="gate" d="M827 129L850 140V166Q850 186 827 198Q804 186 804 166V140Z" fill="#122d2d" stroke="#659c8e" stroke-width="2"/>
<path d="M816 163L824 171 839 151" fill="none" stroke="#9de8d0" stroke-width="3"/>
<circle class="retained" cx="939" cy="166" r="9" fill="#9de8d0"/>
<path d="M795 177L777 198M773 194L781 202M781 194L773 202" stroke="#f6a675" stroke-width="2"/>
<text x="712" y="224" fill="#a7b8ce" font-size="12">Gate updates. Measure drift.</text>
<path class="flow" d="M309 165H358M641 165H690" stroke="#9de8d0"/>
<rect class="stage" x="28" y="80" width="280" height="165" rx="12" stroke="#9de8d0"/>
<rect class="stage second" x="360" y="80" width="280" height="165" rx="12" stroke="#a5b5ff"/>
<rect class="stage third" x="692" y="80" width="280" height="165" rx="12" stroke="#f6a675"/>
<circle class="packet" cx="311" cy="165" r="4" fill="#9de8d0"/>
<circle class="packet second" cx="643" cy="165" r="4" fill="#a5b5ff"/>
<path d="M28 256H308M360 256H640M692 256H972" stroke="#263b52" stroke-width="3"/>
<path class="track" d="M28 256H308" stroke="#9de8d0" stroke-width="3"/>
<path class="track second" d="M360 256H640" stroke="#a5b5ff" stroke-width="3"/>
<path class="track third" d="M692 256H972" stroke="#f6a675" stroke-width="3"/>
<g fill="#edf3ff" font-size="13">
<text class="caption" x="28" y="285">STEP 1 / Compare observations and bring related examples closer.</text>
<text class="caption second" x="28" y="285">STEP 2 / Separate mismatches so distinct evidence stays distinct.</text>
<text class="caption third" x="28" y="285">STEP 3 / Check constraints before retaining a candidate memory update.</text>
</g>
<text x="28" y="313" fill="#7f93ad" font-size="10">Conceptual model / RuVector memory and graphs / workload specific validation required</text>
</svg>