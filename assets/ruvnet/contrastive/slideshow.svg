<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc" class="slideshow"><title id="title">rUv contrastive AI animated walkthrough</title><desc id="desc">Six conceptual scenes explain generation and contrast, similarity, graph cuts, drift detection, gated updates, and the ruvnet workflow. Synthetic diagrams are not measured results. Individual slides are linked in the accompanying guide.</desc><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" stroke="#18334b" stroke-opacity=".35" fill="none"/></pattern></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.flow{stroke-dasharray:6 14;animation:flow 3s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.attract{animation:attract 8s ease-in-out infinite}.repel{animation:repel 8s ease-in-out infinite}.cut{stroke-dasharray:7 6;animation:pulse 3s ease-in-out infinite}.threshold{stroke-dasharray:5 6}.trace{stroke-dasharray:900;animation:trace 8s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes pulse{50%{opacity:.4}}@keyframes attract{50%,85%{transform:translateX(65px)}}@keyframes repel{50%,85%{transform:translateX(55px)}}@keyframes trace{0%{stroke-dashoffset:900}70%,100%{stroke-dashoffset:0}}.scene{opacity:0;animation:scene 48s linear infinite}@keyframes scene{0%,15%{opacity:1}16.5%,100%{opacity:0}}.static .scene{opacity:1;animation:none}@media(prefers-reduced-motion:reduce){*{animation:none!important}.scene{opacity:0}.scene:first-of-type{opacity:1}.static .scene{opacity:1}.trace{stroke-dashoffset:0}}</style><rect width="1000" height="550" rx="18" fill="#080e19"/><rect width="1000" height="550" rx="18" fill="url(#grid)"/><g class="scene" style="animation-delay:0s"><text x="32" y="38" font-size="14" fill="#9de8d0">rUv / CONTRASTIVE INTELLIGENCE</text><text x="865" y="38" font-size="14" fill="#a7b8ce">01 / 06</text><text x="32" y="82" font-size="28" fill="#eaf2ff">Two complementary questions</text><text x="32" y="112" font-size="14" fill="#a7b8ce">Generation proposes outputs. Contrastive learning distinguishes relationships.</text><rect x="40" y="150" width="430" height="225" rx="12" fill="#101d30" stroke="#a5b5ff" stroke-opacity=".5"/><text x="58" y="180" font-size="17" fill="#a5b5ff">GENERATIVE: model possible outputs</text><rect x="530" y="150" width="430" height="225" rx="12" fill="#101d30" stroke="#9de8d0" stroke-opacity=".5"/><text x="548" y="180" font-size="17" fill="#9de8d0">CONTRASTIVE: compare relationships</text><text x="64" y="214" font-size="16" fill="#eaf2ff">Context</text><path class="flow" d="M145 208H205" stroke="#a5b5ff" stroke-width="2" fill="none"/><text x="225" y="214" font-size="16" fill="#eaf2ff">Candidate outputs</text><path class="flow" d="M255 238V265H325" stroke="#a5b5ff" stroke-width="2" fill="none"/><circle class="pulse" cx="325" cy="265" r="6" fill="#a5b5ff"/><path class="flow" d="M255 238V299H349" stroke="#a5b5ff" stroke-width="2" fill="none"/><circle class="pulse" cx="349" cy="299" r="6" fill="#a5b5ff"/><path class="flow" d="M255 238V333H373" stroke="#a5b5ff" stroke-width="2" fill="none"/><circle class="pulse" cx="373" cy="333" r="6" fill="#a5b5ff"/><circle class="pulse" cx="585" cy="247" r="9" fill="#9de8d0"/><circle class="pulse" cx="616" cy="278" r="9" fill="#9de8d0"/><circle class="pulse" cx="649" cy="247" r="9" fill="#9de8d0"/><circle class="pulse" cx="866" cy="269" r="9" fill="#f6a675"/><path class="flow" d="M649 247L866 269" stroke="#f6a675" stroke-width="2" fill="none"/><text x="560" y="332" font-size="14" fill="#eaf2ff">Similarity + separation + checks</text><text x="40" y="432" font-size="15" fill="#c8d7e8">Ask what fits the evidence, which examples differ, and what constraints must hold.</text><text x="40" y="459" font-size="15" fill="#c8d7e8">rUv extends this lens into memory graphs and governed agent workflows.</text><text x="40" y="486" font-size="15" fill="#c8d7e8">These methods can complement generative models.</text><text x="32" y="528" font-size="11" fill="#7f93ad">Conceptual walkthrough / source: RuView issue #87 / no benchmark or truth guarantee</text></g><g class="scene" style="animation-delay:8s"><text x="32" y="38" font-size="14" fill="#9de8d0">rUv / CONTRASTIVE INTELLIGENCE</text><text x="865" y="38" font-size="14" fill="#a7b8ce">02 / 06</text><text x="32" y="82" font-size="28" fill="#eaf2ff">01 / Similarity creates local geometry</text><text x="32" y="112" font-size="14" fill="#a7b8ce">Contrastive objectives learn representations from matching and differing examples.</text><rect x="40" y="150" width="920" height="230" rx="12" fill="#101d30" stroke="#9de8d0" stroke-opacity=".5"/><text x="58" y="180" font-size="17" fill="#9de8d0">LEARN A USEFUL REPRESENTATION</text><g class="attract"><circle class="pulse" cx="215" cy="255" r="9" fill="#9de8d0"/><circle class="pulse" cx="246" cy="291" r="9" fill="#9de8d0"/><circle class="pulse" cx="181" cy="296" r="9" fill="#9de8d0"/></g><circle class="pulse" cx="369" cy="258" r="9" fill="#a5b5ff"/><circle class="pulse" cx="398" cy="293" r="9" fill="#a5b5ff"/><path class="flow" d="M265 275H343" stroke="#9de8d0" stroke-width="2" fill="none"/><g class="repel"><circle class="pulse" cx="690" cy="256" r="9" fill="#f6a675"/><circle class="pulse" cx="721" cy="288" r="9" fill="#f6a675"/></g><text x="95" y="345" font-size="15" fill="#9de8d0">Related examples move closer</text><text x="593" y="345" font-size="15" fill="#f6a675">Mismatches move apart</text><text x="40" y="432" font-size="15" fill="#c8d7e8">Positive pairs define useful similarity; negative examples discourage false matches.</text><text x="40" y="459" font-size="15" fill="#c8d7e8">The pairing strategy and training data determine which distinctions are learned.</text><text x="40" y="486" font-size="15" fill="#c8d7e8">Illustrated motion is conceptual, not a measured embedding trajectory.</text><text x="32" y="528" font-size="11" fill="#7f93ad">Conceptual walkthrough / source: RuView issue #87 / no benchmark or truth guarantee</text></g><g class="scene" style="animation-delay:16s"><text x="32" y="38" font-size="14" fill="#9de8d0">rUv / CONTRASTIVE INTELLIGENCE</text><text x="865" y="38" font-size="14" fill="#a7b8ce">03 / 06</text><text x="32" y="82" font-size="28" fill="#eaf2ff">02 / Examine global graph structure</text><text x="32" y="112" font-size="14" fill="#a7b8ce">Local similarity alone does not describe the stability of an evolving memory graph.</text><rect x="40" y="150" width="920" height="230" rx="12" fill="#101d30" stroke="#9de8d0" stroke-opacity=".5"/><text x="58" y="180" font-size="17" fill="#9de8d0">MEMORY AS RELATIONSHIPS</text><path class="flow" d="M180 228L255 194" stroke="#9de8d0" stroke-width="2" fill="none"/><path class="flow" d="M255 194L300 280" stroke="#9de8d0" stroke-width="2" fill="none"/><path class="flow" d="M300 280L194 328" stroke="#9de8d0" stroke-width="2" fill="none"/><path class="flow" d="M194 328L180 228" stroke="#9de8d0" stroke-width="2" fill="none"/><path class="flow" d="M180 228L300 280" stroke="#9de8d0" stroke-width="2" fill="none"/><path class="flow" d="M669 225L752 197" stroke="#a5b5ff" stroke-width="2" fill="none"/><path class="flow" d="M752 197L802 294" stroke="#a5b5ff" stroke-width="2" fill="none"/><path class="flow" d="M802 294L697 330" stroke="#a5b5ff" stroke-width="2" fill="none"/><path class="flow" d="M697 330L669 225" stroke="#a5b5ff" stroke-width="2" fill="none"/><path class="flow" d="M669 225L802 294" stroke="#a5b5ff" stroke-width="2" fill="none"/><path class="flow" d="M300 280L669 225" stroke="#f6a675" stroke-width="3" fill="none"/><text x="383" y="244" font-size="14" fill="#f6a675">weak bridge</text><circle class="pulse" cx="180" cy="228" r="9" fill="#9de8d0"/><circle class="pulse" cx="255" cy="194" r="9" fill="#9de8d0"/><circle class="pulse" cx="300" cy="280" r="9" fill="#9de8d0"/><circle class="pulse" cx="194" cy="328" r="9" fill="#9de8d0"/><circle class="pulse" cx="669" cy="225" r="9" fill="#a5b5ff"/><circle class="pulse" cx="752" cy="197" r="9" fill="#a5b5ff"/><circle class="pulse" cx="802" cy="294" r="9" fill="#a5b5ff"/><circle class="pulse" cx="697" cy="330" r="9" fill="#a5b5ff"/><path class="cut" d="M485 188V346" stroke="#f6a675" stroke-width="2" fill="none"/><text x="40" y="432" font-size="15" fill="#c8d7e8">A minimum cut finds a partition with the lowest total crossing edge weight.</text><text x="40" y="459" font-size="15" fill="#c8d7e8">In this illustration, a weak bridge connects two strongly connected groups.</text><text x="40" y="486" font-size="15" fill="#c8d7e8">Graph structure is a diagnostic signal; it does not prove semantic correctness.</text><text x="32" y="528" font-size="11" fill="#7f93ad">Conceptual walkthrough / source: RuView issue #87 / no benchmark or truth guarantee</text></g><g class="scene" style="animation-delay:24s"><text x="32" y="38" font-size="14" fill="#9de8d0">rUv / CONTRASTIVE INTELLIGENCE</text><text x="865" y="38" font-size="14" fill="#a7b8ce">04 / 06</text><text x="32" y="82" font-size="28" fill="#eaf2ff">03 / Make drift observable</text><text x="32" y="112" font-size="14" fill="#a7b8ce">Track whether new observations depart from a reference distribution or structure.</text><rect x="40" y="150" width="920" height="230" rx="12" fill="#101d30" stroke="#9de8d0" stroke-opacity=".5"/><text x="58" y="180" font-size="17" fill="#9de8d0">WATCH CHANGE OVER TIME</text><path class="axis" d="M90 330H865M90 330V200" stroke="#49617d" stroke-width="2" fill="none"/><path class="threshold" d="M90 265H865" stroke="#f6a675" stroke-width="2" fill="none"/><text x="670" y="252" font-size="13" fill="#f6a675">chosen threshold</text><path class="trace" d="M100 316L200 303 300 307 400 286 500 280 600 250 700 221 800 209" stroke="#9de8d0" stroke-width="3" fill="none"/><circle class="pulse" cx="700" cy="221" r="10" fill="#f6a675"/><text x="130" y="356" font-size="13" fill="#a7b8ce">Earlier observations</text><text x="690" y="356" font-size="13" fill="#a7b8ce">Recent observations</text><text x="40" y="432" font-size="15" fill="#c8d7e8">Choose a reference, a drift metric, and an explicit response policy.</text><text x="40" y="459" font-size="15" fill="#c8d7e8">Crossing a threshold can trigger review, recalibration, or a paused update.</text><text x="40" y="486" font-size="15" fill="#c8d7e8">This trace is synthetic and has no quantitative performance meaning.</text><text x="32" y="528" font-size="11" fill="#7f93ad">Conceptual walkthrough / source: RuView issue #87 / no benchmark or truth guarantee</text></g><g class="scene" style="animation-delay:32s"><text x="32" y="38" font-size="14" fill="#9de8d0">rUv / CONTRASTIVE INTELLIGENCE</text><text x="865" y="38" font-size="14" fill="#a7b8ce">05 / 06</text><text x="32" y="82" font-size="28" fill="#eaf2ff">04 / Gate learning before promotion</text><text x="32" y="112" font-size="14" fill="#a7b8ce">A candidate update is a proposal until the configured checks and authority permit it.</text><rect x="40" y="180" width="220" height="160" rx="12" fill="#101d30" stroke="#9de8d0" stroke-opacity=".5"/><text x="58" y="210" font-size="17" fill="#9de8d0">CANDIDATE</text><rect x="357" y="180" width="280" height="160" rx="12" fill="#101d30" stroke="#9de8d0" stroke-opacity=".5"/><text x="375" y="210" font-size="17" fill="#9de8d0">CONSTRAINT GATE</text><rect x="742" y="150" width="216" height="100" rx="12" fill="#101d30" stroke="#9de8d0" stroke-opacity=".5"/><text x="760" y="180" font-size="17" fill="#9de8d0">RETAIN</text><rect x="742" y="285" width="216" height="100" rx="12" fill="#101d30" stroke="#f6a675" stroke-opacity=".5"/><text x="760" y="315" font-size="17" fill="#f6a675">REJECT / REVIEW</text><text x="60" y="250" font-size="14" fill="#eaf2ff">Proposed update</text><text x="377" y="240" font-size="14" fill="#eaf2ff">Policy + validation</text><text x="377" y="270" font-size="14" fill="#eaf2ff">Drift + regression</text><path class="flow" d="M260 265H357" stroke="#9de8d0" stroke-width="2" fill="none"/><path class="flow" d="M637 240H684V200H742" stroke="#9de8d0" stroke-width="2" fill="none"/><path class="flow" d="M637 280H684V335H742" stroke="#f6a675" stroke-width="2" fill="none"/><text x="762" y="216" font-size="12" fill="#eaf2ff">Pass required checks</text><text x="762" y="350" font-size="12" fill="#f6a675">Preserve prior state</text><text x="40" y="432" font-size="15" fill="#c8d7e8">Retain changes only after workload specific validation and policy checks.</text><text x="40" y="459" font-size="15" fill="#c8d7e8">Keep the previous state available for replay, investigation, and rollback.</text><text x="40" y="486" font-size="15" fill="#c8d7e8">A passing graph check alone is insufficient to authorize promotion.</text><text x="32" y="528" font-size="11" fill="#7f93ad">Conceptual walkthrough / source: RuView issue #87 / no benchmark or truth guarantee</text></g><g class="scene" style="animation-delay:40s"><text x="32" y="38" font-size="14" fill="#9de8d0">rUv / CONTRASTIVE INTELLIGENCE</text><text x="865" y="38" font-size="14" fill="#a7b8ce">06 / 06</text><text x="32" y="82" font-size="28" fill="#eaf2ff">05 / Connect perception to useful work</text><text x="32" y="112" font-size="14" fill="#a7b8ce">The stack supplies complementary roles; integration and maturity vary by project.</text><rect x="40" y="150" width="280" height="155" rx="12" fill="#101d30" stroke="#9de8d0" stroke-opacity=".5"/><text x="58" y="180" font-size="17" fill="#9de8d0">OBSERVE + REMEMBER</text><rect x="360" y="150" width="280" height="155" rx="12" fill="#101d30" stroke="#a5b5ff" stroke-opacity=".5"/><text x="378" y="180" font-size="17" fill="#a5b5ff">COORDINATE + ACT</text><rect x="680" y="150" width="280" height="155" rx="12" fill="#101d30" stroke="#f6a675" stroke-opacity=".5"/><text x="698" y="180" font-size="17" fill="#f6a675">EVALUATE + RECORD</text><text x="60" y="215" font-size="15" fill="#eaf2ff">RuView observations</text><text x="60" y="249" font-size="15" fill="#eaf2ff">RuVector context</text><text x="380" y="215" font-size="15" fill="#eaf2ff">Ruflo agents</text><text x="380" y="249" font-size="15" fill="#eaf2ff">RVM capabilities</text><text x="700" y="215" font-size="15" fill="#eaf2ff">MetaHarness checks</text><text x="700" y="249" font-size="15" fill="#eaf2ff">RVF evidence</text><path class="flow" d="M320 232H360" stroke="#9de8d0" stroke-width="2" fill="none"/><path class="flow" d="M640 232H680" stroke="#a5b5ff" stroke-width="2" fill="none"/><path class="flow" d="M820 305V360H180V305" stroke="#f6a675" stroke-width="2" fill="none"/><text x="360" y="350" font-size="14" fill="#f6a675">Feedback / review / bounded update</text><text x="40" y="432" font-size="15" fill="#c8d7e8">Ground actions in observations, preserve context, and evaluate the outcome.</text><text x="40" y="459" font-size="15" fill="#c8d7e8">Measure task quality, drift, regression, cost, and latency on held out workloads.</text><text x="40" y="486" font-size="15" fill="#c8d7e8">Retain improvements only when evidence and authorization support them.</text><text x="32" y="528" font-size="11" fill="#7f93ad">Conceptual walkthrough / source: RuView issue #87 / no benchmark or truth guarantee</text></g></svg>