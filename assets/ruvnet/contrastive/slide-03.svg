<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc" class="static"><title id="title">rUv contrastive AI animated walkthrough</title><desc id="desc">Six conceptual scenes explain generation and contrast, similarity, graph cuts, drift detection, gated updates, and the ruvnet workflow. Synthetic diagrams are not measured results. Individual slides are linked in the accompanying guide.</desc><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" stroke="#18334b" stroke-opacity=".35" fill="none"/></pattern></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.flow{stroke-dasharray:6 14;animation:flow 3s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.attract{animation:attract 8s ease-in-out infinite}.repel{animation:repel 8s ease-in-out infinite}.cut{stroke-dasharray:7 6;animation:pulse 3s ease-in-out infinite}.threshold{stroke-dasharray:5 6}.trace{stroke-dasharray:900;animation:trace 8s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes pulse{50%{opacity:.4}}@keyframes attract{50%,85%{transform:translateX(65px)}}@keyframes repel{50%,85%{transform:translateX(55px)}}@keyframes trace{0%{stroke-dashoffset:900}70%,100%{stroke-dashoffset:0}}.scene{opacity:0;animation:scene 48s linear infinite}@keyframes scene{0%,15%{opacity:1}16.5%,100%{opacity:0}}.static .scene{opacity:1;animation:none}@media(prefers-reduced-motion:reduce){*{animation:none!important}.scene{opacity:0}.scene:first-of-type{opacity:1}.static .scene{opacity:1}.trace{stroke-dashoffset:0}}</style><rect width="1000" height="550" rx="18" fill="#080e19"/><rect width="1000" height="550" rx="18" fill="url(#grid)"/><g class="scene"><text x="32" y="38" font-size="14" fill="#9de8d0">rUv / CONTRASTIVE INTELLIGENCE</text><text x="865" y="38" font-size="14" fill="#a7b8ce">03 / 06</text><text x="32" y="82" font-size="28" fill="#eaf2ff">02 / Examine global graph structure</text><text x="32" y="112" font-size="14" fill="#a7b8ce">Local similarity alone does not describe the stability of an evolving memory graph.</text><rect x="40" y="150" width="920" height="230" rx="12" fill="#101d30" stroke="#9de8d0" stroke-opacity=".5"/><text x="58" y="180" font-size="17" fill="#9de8d0">MEMORY AS RELATIONSHIPS</text><path class="flow" d="M180 228L255 194" stroke="#9de8d0" stroke-width="2" fill="none"/><path class="flow" d="M255 194L300 280" stroke="#9de8d0" stroke-width="2" fill="none"/><path class="flow" d="M300 280L194 328" stroke="#9de8d0" stroke-width="2" fill="none"/><path class="flow" d="M194 328L180 228" stroke="#9de8d0" stroke-width="2" fill="none"/><path class="flow" d="M180 228L300 280" stroke="#9de8d0" stroke-width="2" fill="none"/><path class="flow" d="M669 225L752 197" stroke="#a5b5ff" stroke-width="2" fill="none"/><path class="flow" d="M752 197L802 294" stroke="#a5b5ff" stroke-width="2" fill="none"/><path class="flow" d="M802 294L697 330" stroke="#a5b5ff" stroke-width="2" fill="none"/><path class="flow" d="M697 330L669 225" stroke="#a5b5ff" stroke-width="2" fill="none"/><path class="flow" d="M669 225L802 294" stroke="#a5b5ff" stroke-width="2" fill="none"/><path class="flow" d="M300 280L669 225" stroke="#f6a675" stroke-width="3" fill="none"/><text x="383" y="244" font-size="14" fill="#f6a675">weak bridge</text><circle class="pulse" cx="180" cy="228" r="9" fill="#9de8d0"/><circle class="pulse" cx="255" cy="194" r="9" fill="#9de8d0"/><circle class="pulse" cx="300" cy="280" r="9" fill="#9de8d0"/><circle class="pulse" cx="194" cy="328" r="9" fill="#9de8d0"/><circle class="pulse" cx="669" cy="225" r="9" fill="#a5b5ff"/><circle class="pulse" cx="752" cy="197" r="9" fill="#a5b5ff"/><circle class="pulse" cx="802" cy="294" r="9" fill="#a5b5ff"/><circle class="pulse" cx="697" cy="330" r="9" fill="#a5b5ff"/><path class="cut" d="M485 188V346" stroke="#f6a675" stroke-width="2" fill="none"/><text x="40" y="432" font-size="15" fill="#c8d7e8">A minimum cut finds a partition with the lowest total crossing edge weight.</text><text x="40" y="459" font-size="15" fill="#c8d7e8">In this illustration, a weak bridge connects two strongly connected groups.</text><text x="40" y="486" font-size="15" fill="#c8d7e8">Graph structure is a diagnostic signal; it does not prove semantic correctness.</text><text x="32" y="528" font-size="11" fill="#7f93ad">Conceptual walkthrough / source: RuView issue #87 / no benchmark or truth guarantee</text></g></svg>