<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc" class="static"><title id="title">rUv contrastive AI animated walkthrough</title><desc id="desc">Six conceptual scenes explain generation and contrast, similarity, graph cuts, drift detection, gated updates, and the ruvnet workflow. Synthetic diagrams are not measured results. Individual slides are linked in the accompanying guide.</desc><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" stroke="#18334b" stroke-opacity=".35" fill="none"/></pattern></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.flow{stroke-dasharray:6 14;animation:flow 3s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.attract{animation:attract 8s ease-in-out infinite}.repel{animation:repel 8s ease-in-out infinite}.cut{stroke-dasharray:7 6;animation:pulse 3s ease-in-out infinite}.threshold{stroke-dasharray:5 6}.trace{stroke-dasharray:900;animation:trace 8s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes pulse{50%{opacity:.4}}@keyframes attract{50%,85%{transform:translateX(65px)}}@keyframes repel{50%,85%{transform:translateX(55px)}}@keyframes trace{0%{stroke-dashoffset:900}70%,100%{stroke-dashoffset:0}}.scene{opacity:0;animation:scene 48s linear infinite}@keyframes scene{0%,15%{opacity:1}16.5%,100%{opacity:0}}.static .scene{opacity:1;animation:none}@media(prefers-reduced-motion:reduce){*{animation:none!important}.scene{opacity:0}.scene:first-of-type{opacity:1}.static .scene{opacity:1}.trace{stroke-dashoffset:0}}</style><rect width="1000" height="550" rx="18" fill="#080e19"/><rect width="1000" height="550" rx="18" fill="url(#grid)"/><g class="scene"><text x="32" y="38" font-size="14" fill="#9de8d0">rUv / CONTRASTIVE INTELLIGENCE</text><text x="865" y="38" font-size="14" fill="#a7b8ce">05 / 06</text><text x="32" y="82" font-size="28" fill="#eaf2ff">04 / Gate learning before promotion</text><text x="32" y="112" font-size="14" fill="#a7b8ce">A candidate update is a proposal until the configured checks and authority permit it.</text><rect x="40" y="180" width="220" height="160" rx="12" fill="#101d30" stroke="#9de8d0" stroke-opacity=".5"/><text x="58" y="210" font-size="17" fill="#9de8d0">CANDIDATE</text><rect x="357" y="180" width="280" height="160" rx="12" fill="#101d30" stroke="#9de8d0" stroke-opacity=".5"/><text x="375" y="210" font-size="17" fill="#9de8d0">CONSTRAINT GATE</text><rect x="742" y="150" width="216" height="100" rx="12" fill="#101d30" stroke="#9de8d0" stroke-opacity=".5"/><text x="760" y="180" font-size="17" fill="#9de8d0">RETAIN</text><rect x="742" y="285" width="216" height="100" rx="12" fill="#101d30" stroke="#f6a675" stroke-opacity=".5"/><text x="760" y="315" font-size="17" fill="#f6a675">REJECT / REVIEW</text><text x="60" y="250" font-size="14" fill="#eaf2ff">Proposed update</text><text x="377" y="240" font-size="14" fill="#eaf2ff">Policy + validation</text><text x="377" y="270" font-size="14" fill="#eaf2ff">Drift + regression</text><path class="flow" d="M260 265H357" stroke="#9de8d0" stroke-width="2" fill="none"/><path class="flow" d="M637 240H684V200H742" stroke="#9de8d0" stroke-width="2" fill="none"/><path class="flow" d="M637 280H684V335H742" stroke="#f6a675" stroke-width="2" fill="none"/><text x="762" y="216" font-size="12" fill="#eaf2ff">Pass required checks</text><text x="762" y="350" font-size="12" fill="#f6a675">Preserve prior state</text><text x="40" y="432" font-size="15" fill="#c8d7e8">Retain changes only after workload specific validation and policy checks.</text><text x="40" y="459" font-size="15" fill="#c8d7e8">Keep the previous state available for replay, investigation, and rollback.</text><text x="40" y="486" font-size="15" fill="#c8d7e8">A passing graph check alone is insufficient to authorize promotion.</text><text x="32" y="528" font-size="11" fill="#7f93ad">Conceptual walkthrough / source: RuView issue #87 / no benchmark or truth guarantee</text></g></svg>