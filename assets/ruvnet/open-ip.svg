<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">rUv / OPEN CODE, TRACEABLE CONTRIBUTIONS</title><desc id="desc">The intellectual property approach: publish, attribute, document, and build enterprise value.</desc><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#163047" stroke-opacity=".4"/></pattern></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.route{stroke-dasharray:6 14;animation:route 4s linear infinite}.active{fill-opacity:.06;stroke-opacity:.4;animation:active 12s ease-in-out infinite}.grow{transform-box:fill-box;transform-origin:center;animation:grow 6s ease-in-out infinite}.draw{stroke-dasharray:200;animation:draw 6s ease-in-out infinite}@keyframes route{to{stroke-dashoffset:-120}}@keyframes active{0%,18%{stroke-opacity:1;fill-opacity:.18}25%,100%{stroke-opacity:.25;fill-opacity:.04}}@keyframes grow{50%{transform:scale(1.08)}}@keyframes draw{0%{stroke-dashoffset:200}65%,100%{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1000" height="320" rx="16" fill="#080e19"/><rect width="1000" height="320" rx="16" fill="url(#grid)"/><text x="28" y="36" fill="#edf3ff" font-size="18">rUv / OPEN CODE, TRACEABLE CONTRIBUTIONS</text><text x="28" y="60" fill="#a7b8ce" font-size="12">The intellectual property approach: publish, attribute, document, and build enterprise value.</text><rect class="active" style="animation-delay:0s" x="28" y="92" width="280" height="137" rx="12" fill="#9de8d0" stroke="#9de8d0"/><text x="46" y="120" font-size="15" fill="#9de8d0">BUILD IN PUBLIC</text><text x="46" y="147" font-size="12" fill="#a7b8ce">Working implementations</text><text x="46" y="168" font-size="12" fill="#a7b8ce">Credit foundational work</text><text x="46" y="189" font-size="12" fill="#a7b8ce">Repository licenses</text><rect class="active" style="animation-delay:4s" x="360" y="92" width="280" height="137" rx="12" fill="#a5b5ff" stroke="#a5b5ff"/><text x="378" y="120" font-size="15" fill="#a5b5ff">PRESERVE EVIDENCE</text><text x="378" y="147" font-size="12" fill="#a7b8ce">Dated commits and releases</text><text x="378" y="168" font-size="12" fill="#a7b8ce">Reproducible results</text><text x="378" y="189" font-size="12" fill="#a7b8ce">Scoped novelty claims</text><rect class="active" style="animation-delay:8s" x="692" y="92" width="280" height="137" rx="12" fill="#f6a675" stroke="#f6a675"/><text x="710" y="120" font-size="15" fill="#f6a675">DELIVER VALUE</text><text x="710" y="147" font-size="12" fill="#a7b8ce">Cognitum integration</text><text x="710" y="168" font-size="12" fill="#a7b8ce">Hardware and governance</text><text x="710" y="189" font-size="12" fill="#a7b8ce">Support and deployment</text><path class="route" d="M309 161H359M641 161H691" stroke="#9de8d0" stroke-width="2"/><text x="28" y="270" font-size="14" fill="#edf3ff">Open implementations + inspectable provenance + commercial execution.</text><text x="28" y="301" font-size="10" fill="#7f93ad">Public provenance records contributions; it does not itself grant patent rights or exclusive ownership.</text></svg>