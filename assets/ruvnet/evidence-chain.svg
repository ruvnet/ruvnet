<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc"><title id="title">FROM SOURCE TO VISIBLE EVIDENCE</title><desc id="desc">Committed snapshots keep measurement windows separate from decorative motion.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#163047" stroke-opacity=".3"/></pattern><radialGradient id="halo"><stop stop-color="#233759"/><stop offset="1" stop-color="#080e19"/></radialGradient></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.signal{stroke-dasharray:3 13;animation:signal 5s linear infinite}.orbit{animation:turn 32s linear infinite;transform-box:fill-box;transform-origin:center}.reverse{animation-direction:reverse;animation-duration:47s}.pulse{animation:pulse 4s ease-in-out infinite}.draw{stroke-dasharray:900;animation:draw 9s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}@keyframes signal{to{stroke-dashoffset:-160}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}@keyframes draw{0%{stroke-dashoffset:900}60%,100%{stroke-dashoffset:0}}@keyframes float{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="260" rx="14" fill="#080e19"/><rect width="1200" height="260" rx="14" fill="url(#grid)"/><text x="30" y="35" font-size="15" fill="#edf3ff" text-anchor="start">FROM SOURCE TO VISIBLE EVIDENCE</text><text x="30" y="58" font-size="11" fill="#a7b8ce" text-anchor="start">Committed snapshots keep measurement windows separate from decorative motion.</text><path class="signal" d="M280 150H325" stroke="#f6a675"/><path d="M315 145L322 150 315 155" fill="none" stroke="#f6a675"/><rect x="30" y="85" width="255" height="145" rx="10" fill="#0d1726" stroke="#263b52"/><g transform="translate(78 137)"><g fill="none" stroke="#f6a675" stroke-width="1.5" color="