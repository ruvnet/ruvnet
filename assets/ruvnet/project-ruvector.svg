<svg xmlns="http://www.w3.org/2000/svg" width="580" height="210" viewBox="0 0 580 210" role="img" aria-labelledby="title desc"><title id="title">RuVector</title><desc id="desc">Vector and graph intelligence for memory.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#163047" stroke-opacity=".3"/></pattern><radialGradient id="halo"><stop stop-color="#233759"/><stop offset="1" stop-color="#080e19"/></radialGradient></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.signal{stroke-dasharray:3 13;animation:signal 5s linear infinite}.orbit{animation:turn 32s linear infinite;transform-box:fill-box;transform-origin:center}.reverse{animation-direction:reverse;animation-duration:47s}.pulse{animation:pulse 4s ease-in-out infinite}.draw{stroke-dasharray:900;animation:draw 9s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}@keyframes signal{to{stroke-dashoffset:-160}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}@keyframes draw{0%{stroke-dashoffset:900}60%,100%{stroke-dashoffset:0}}@keyframes float{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="580" height="210" rx="14" fill="#080e19"/><rect width="580" height="210" rx="14" fill="url(#grid)"/><path d="M20 20H48M20 20V48M560 190H532M560 190V162" fill="none" stroke="#9de8d0"/><text x="32" y="43" font-size="12" fill="#9de8d0" text-anchor="start">02 / REMEMBER</text><text x="32" y="94" font-size="32" fill="#edf3ff" text-anchor="start">RuVector</text><text x="32" y="132" font-size="12" fill="#a7b8ce" text-anchor="start">Vector and graph intelligence for memory.</text><text x="32" y="181" font-size="11" fill="#9de8d0" text-anchor="start">EXPLORE PROJECT  ↗</text><g transform="translate(492 76)"><circle class="orbit" r="47" fill="none" stroke="#9de8d0" stroke-opacity=".5" stroke-dasharray="25 9 2 9"/><g fill="none" stroke="#9de8d0" stroke-width="1.5" color="#9de8d0"><path d="M-28-12L0-27 28-12 0 3ZM-28-2L0 13 28-2M-28 9L0 24 28 9M-28 20L0 35 28 20"/><path class="signal" d="M0-27V35"/></g></g><path d="M260 177H548" stroke="#26364a"/><path class="signal" style="animation-delay:-1s" d="M260 177H548" stroke="#9de8d0"/></svg>