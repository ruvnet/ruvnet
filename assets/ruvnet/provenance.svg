<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="title desc"><title id="title">Evidence is part of the interface</title><desc id="desc">Source / snapshot / counting rule / reproducible check</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#163047" stroke-opacity=".3"/></pattern><radialGradient id="halo"><stop stop-color="#233759"/><stop offset="1" stop-color="#080e19"/></radialGradient></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.signal{stroke-dasharray:3 13;animation:signal 5s linear infinite}.orbit{animation:turn 32s linear infinite;transform-box:fill-box;transform-origin:center}.reverse{animation-direction:reverse;animation-duration:47s}.pulse{animation:pulse 4s ease-in-out infinite}.draw{stroke-dasharray:900;animation:draw 9s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}@keyframes signal{to{stroke-dashoffset:-160}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}@keyframes draw{0%{stroke-dashoffset:900}60%,100%{stroke-dashoffset:0}}@keyframes float{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="160" rx="14" fill="#080e19"/><rect width="1200" height="160" rx="14" fill="url(#grid)"/><text x="30" y="35" font-size="11" fill="#a5b5ff" text-anchor="start">RUVNET / 08</text><text x="30" y="78" font-size="29" fill="#edf3ff" text-anchor="start">Evidence is part of the interface</text><text x="30" y="109" font-size="13" fill="#a7b8ce" text-anchor="start">Source / snapshot / counting rule / reproducible check</text><path d="M30 140H1170" stroke="#23344b"/><path class="signal" d="M30 140H1170" stroke="#a5b5ff"/><g transform="translate(1100 75)"><circle class="orbit" r="55" fill="none" stroke="#a5b5ff" stroke-dasharray="30 8 2 8"/><g fill="none" stroke="#a5b5ff" s