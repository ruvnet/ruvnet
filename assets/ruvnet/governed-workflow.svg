<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">rUv / TURN INTENT INTO VERIFIED WORK</title><desc id="desc">Shared context, controlled execution, evaluation, and a route back when the result needs revision.</desc><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#163047" stroke-opacity=".4"/></pattern></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.route{stroke-dasharray:6 14;animation:route 4s linear infinite}.active{fill-opacity:.06;stroke-opacity:.4;animation:active 12s ease-in-out infinite}.grow{transform-box:fill-box;transform-origin:center;animation:grow 6s ease-in-out infinite}.draw{stroke-dasharray:200;animation:draw 6s ease-in-out infinite}@keyframes route{to{stroke-dashoffset:-120}}@keyframes active{0%,18%{stroke-opacity:1;fill-opacity:.18}25%,100%{stroke-opacity:.25;fill-opacity:.04}}@keyframes grow{50%{transform:scale(1.08)}}@keyframes draw{0%{stroke-dashoffset:200}65%,100%{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1000" height="320" rx="16" fill="#080e19"/><rect width="1000" height="320" rx="16" fill="url(#grid)"/><text x="28" y="36" fill="#edf3ff" font-size="18">rUv / TURN INTENT INTO VERIFIED WORK</text><text x="28" y="60" fill="#a7b8ce" font-size="12">Shared context, controlled execution, evaluation, and a route back when the result needs revision.</text><path class="route" d="M268 150H352M592 150H692M812 206V252H470V206M812 206V270H926" stroke="#9de8d0" fill="none" stroke-width="2"/><rect class="active" style="animation-delay:0s" x="28" y="90" width="240" height="116" rx="12" fill="#9de8d0" stroke="#9de8d0"/><text x="46" y="118" font-size="15" fill="#9de8d0">TASK + CONTEXT</text><text x="46" y="145" font-size="12" fill="#a7b8ce">RuVector memory</text><text x="46" y="166" font-size="12" fill="#a7b8ce">Relevant observations</text><rect class="active" style="animation-delay:4s" x="352" y="90" width="240" height="116" rx="12" fill="#a5b5ff" stroke="#a5b5ff"/><text x="370" y="118" font-size="15" fill="#a5b5ff">COORDINATE + EXECUTE</text><text x="370" y="145" font-size="12" fill="#a7b8ce">Ruflo agents</text><text x="370" y="166" font-size="12" fill="#a7b8ce">RVM capability controls</text><rect class="active" style="animation-delay:8s" x="692" y="90" width="240" height="116" rx="12" fill="#f6a675" stroke="#f6a675"/><text x="710" y="118" font-size="15" fill="#f6a675">EVALUATE</text><text x="710" y="145" font-size="12" fill="#a7b8ce">MetaHarness checks</text><text x="710" y="166" font-size="12" fill="#a7b8ce">Workload specific criteria</text><text x="500" y="245" font-size="12" fill="#f6a675">REVISE / replay evidence</text><text x="800" y="294" font-size="12" fill="#9de8d0">RETAIN / policy gate</text><path class="draw" d="M934 258L943 268 965 245" fill="none" stroke="#9de8d0" stroke-width="3"/><text x="28" y="301" font-size="10" fill="#7f93ad">Conceptual workflow. Promotion requires evaluation and the applicable human approval policy.</text></svg>