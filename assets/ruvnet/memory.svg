<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="132" viewBox="0 0 1200 132" role="img" aria-labelledby="title desc"><title id="title">Memory that travels</title><desc id="desc">State / evidence / portable execution</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#163047" stroke-opacity=".3"/></pattern><radialGradient id="halo"><stop stop-color="#233759"/><stop offset="1" stop-color="#080e19"/></radialGradient></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.signal{stroke-dasharray:3 13;animation:signal 5s linear infinite}.orbit{animation:turn 32s linear infinite;transform-box:fill-box;transform-origin:center}.reverse{animation-direction:reverse;animation-duration:47s}.pulse{animation:pulse 4s ease-in-out infinite}.draw{stroke-dasharray:900;animation:draw 9s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}@keyframes signal{to{stroke-dashoffset:-160}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}@keyframes draw{0%{stroke-dashoffset:900}60%,100%{stroke-dashoffset:0}}@keyframes float{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="132" rx="14" fill="#080e19"/><rect width="1200" height="132" rx="14" fill="url(#grid)"/><path d="M24 112H1176" stroke="#23334c"/><path class="signal" d="M24 112H1176" stroke="#9de8d0"/><text x="28" y="38" font-size="11" fill="#9de8d0" text-anchor="start">RUVNET / 06</text><text x="28" y="72" font-size="27" fill="#ecf3ff" text-anchor="start">Memory that travels</text><text x="28" y="96" font-size="12" fill="#a7b8ce" text-anchor="start">State / evidence / portable execution</text><g transform="translate(1100 62)"><circle r="46" stroke="#9de8d0" stroke-opacity=".15" fill="none"/><g class="orbit"><circle r="42" stroke="#9de8d0" stroke-dasharray="40 15 2 15" fill="none"/></g><g fill="none" stroke="#9de8d0" stroke-width="1.5" color="#9de8d0"><path d="M-28-12L0-27 28-12 0 3ZM-28-2L0 13 28-2M-28 9L0 24 28 9M-28 20L0 35 28 20"/><path class="signal" d="M0-27V35"/></g></g></svg>