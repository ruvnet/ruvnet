<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">rUv / BUILDING THE AGENTIC STACK</title><desc id="desc">From early AI tooling to systems that coordinate, remember, execute, and evaluate.</desc><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#163047" stroke-opacity=".4"/></pattern></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.route{stroke-dasharray:6 14;animation:route 4s linear infinite}.active{fill-opacity:.06;stroke-opacity:.4;animation:active 12s ease-in-out infinite}.grow{transform-box:fill-box;transform-origin:center;animation:grow 6s ease-in-out infinite}.draw{stroke-dasharray:200;animation:draw 6s ease-in-out infinite}@keyframes route{to{stroke-dashoffset:-120}}@keyframes active{0%,18%{stroke-opacity:1;fill-opacity:.18}25%,100%{stroke-opacity:.25;fill-opacity:.04}}@keyframes grow{50%{transform:scale(1.08)}}@keyframes draw{0%{stroke-dashoffset:200}65%,100%{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1000" height="320" rx="16" fill="#080e19"/><rect width="1000" height="320" rx="16" fill="url(#grid)"/><text x="28" y="36" fill="#edf3ff" font-size="18">rUv / BUILDING THE AGENTIC STACK</text><text x="28" y="60" fill="#a7b8ce" font-size="12">From early AI tooling to systems that coordinate, remember, execute, and evaluate.</text><rect class="active" style="animation-delay:0s" x="28" y="90" width="212" height="119" rx="12" fill="#9de8d0" stroke="#9de8d0"/><text x="46" y="118" font-size="15" fill="#9de8d0">2023 / EXPLORATION</text><text x="46" y="145" font-size="12" fill="#a7b8ce">AI tools</text><text x="46" y="166" font-size="12" fill="#a7b8ce">ChatGPT plugins</text><circle class="grow" cx="134" cy="242" r="6" fill="#9de8d0"/><path class="route" d="M143 242H368" stroke="#9de8d0" fill="none"/><rect class="active" style="animation-delay:3s" x="272" y="90" width="212" height="119" rx="12" fill="#a5b5ff" stroke="#a5b5ff"/><text x="290" y="118" font-size="15" fill="#a5b5ff">2024 / METHOD</text><text x="290" y="145" font-size="12" fill="#a7b8ce">SPARC workflows</text><text x="290" y="166" font-size="12" fill="#a7b8ce">Structured development</text><circle class="grow" cx="378" cy="242" r="6" fill="#a5b5ff"/><path class="route" d="M387 242H612" stroke="#a5b5ff" fill="none"/><rect class="active" style="animation-delay:6s" x="516" y="90" width="212" height="119" rx="12" fill="#f6a675" stroke="#f6a675"/><text x="534" y="118" font-size="15" fill="#f6a675">2025 / COORDINATION</text><text x="534" y="145" font-size="12" fill="#a7b8ce">Claude Flow lineage</text><text x="534" y="166" font-size="12" fill="#a7b8ce">Agent swarms</text><circle class="grow" cx="622" cy="242" r="6" fill="#f6a675"/><path class="route" d="M631 242H856" stroke="#f6a675" fill="none"/><rect class="active" style="animation-delay:9s" x="760" y="90" width="212" height="119" rx="12" fill="#9de8d0" stroke="#9de8d0"/><text x="778" y="118" font-size="15" fill="#9de8d0">2026 / SYSTEMS</text><text x="778" y="145" font-size="12" fill="#a7b8ce">Memory and runtimes</text><text x="778" y="166" font-size="12" fill="#a7b8ce">Governed improvement</text><circle class="grow" cx="866" cy="242" r="6" fill="#9de8d0"/><text x="28" y="295" font-size="10" fill="#7f93ad">Dates summarize the documented lineage; specific feature and novelty claims require their own evidence.</text></svg>