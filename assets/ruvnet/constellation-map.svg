<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">The rUv constellation</title><desc id="desc">Conceptual relationships between sensing, memory, coordination, execution, evaluation, and governed adaptation. Links illustrate roles, not guaranteed integrations or live telemetry.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#163047" stroke-opacity=".3"/></pattern><radialGradient id="halo"><stop stop-color="#233759"/><stop offset="1" stop-color="#080e19"/></radialGradient></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.signal{stroke-dasharray:3 13;animation:signal 5s linear infinite}.orbit{animation:turn 32s linear infinite;transform-box:fill-box;transform-origin:center}.reverse{animation-direction:reverse;animation-duration:47s}.pulse{animation:pulse 4s ease-in-out infinite}.draw{stroke-dasharray:900;animation:draw 9s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}@keyframes signal{to{stroke-dashoffset:-160}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}@keyframes draw{0%{stroke-dashoffset:900}60%,100%{stroke-dashoffset:0}}@keyframes float{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="660" rx="14" fill="#080e19"/><rect width="1200" height="660" rx="14" fill="url(#grid)"/><text x="30" y="40" font-size="14" fill="#dce9ff" text-anchor="start">RUV / SYSTEMS CONSTELLATION</text><text x="1170" y="40" font-size="10" fill="#a7b8ce" text-anchor="end">ROLE MAP · NOT LIVE TELEMETRY</text><ellipse cx="600" cy="330" rx="400" ry="220" fill="none" stroke="#20304a" stroke-dasharray="2 8"/><ellipse cx="600" cy="330" rx="310" ry="175" fill="none" stroke="#1b2940"/><path d="M600 330Q440.0 252.5 210 175" fill="none" stroke="#2a3b53"/><path class="