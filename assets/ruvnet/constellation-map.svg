or="middle">Ruflo</text><text x="0" y="52" font-size="11" fill="#95a9c0" text-anchor="middle">Agents, tasks and shared context</text></g><g transform="translate(990 480)"><rect x="-164" y="-73" width="328" height="146" rx="12" fill="#0c1422" stroke="#26364d"/><path d="M-148-73H-110M148 73H110" stroke="#9de8d0" stroke-width="2"/><g transform="translate(-120 -26)"><g fill="none" stroke="#9de8d0" stroke-width="1.5" color="#9de8d0"><path d="M0-30L27-15V15L0 30-27 15V-15ZM-27-15L0 0 27-15M0 0V30"/><path class="signal" d="M0-30V0L-27 15"/></g></g><text x="-70" y="-33" font-size="13" fill="#9de8d0" text-anchor="start">04 / EXECUTE</text><text x="-70" y="-10" font-size="9" fill="#a7b8ce" text-anchor="start">CONNECTED CAPABILITY</text><text x="0" y="29" font-size="14" fill="#edf3fd" text-anchor="middle">RVF · RVForge · RVM</text><text x="0" y="52" font-size="11" fill="#95a9c0" text-anchor="middle">Portable state and capability controls</text></g><g transform="translate(600 545)"><rect x="-164" y="-73" width="328" height="146" rx="12" fill="#0c1422" stroke="#26364d"/><path d="M-148-73H-110M148 73H110" stroke="#f6a675" stroke-width="2"/><g transform="translate(-120 -26)"><g fill="none" stroke="#f6a675" stroke-width="1.5" color="#f6a675"><path d="M-28-27V27H30M-20 14L-8 2 4 8 25-16"/><circle cx="25" cy="-16" r="6"/><path d="M-20-20H5M-20-12H-4"/></g></g><text x="-70" y="-33" font-size="13" fill="#f6a675" text-anchor="start">05 / EVALUATE</text><text x="-70" y="-10" font-size="9" fill="#a7b8ce" text-anchor="start">CONNECTED CAPABILITY</text><text x="0" y="29" font-size="14" fill="#edf3fd" text-anchor="middle">MetaHarness · APx</text><text x="0" y="52" font-size="11" fill="#95a9c0" text-anchor="middle">Changes, outcomes and useful work</text></g><g transform="translate(210 480)"><rect x="-164" y="-73" width="328" height="146" rx="12" fill="#0c1422" stroke="#26364d"/><path d="M-148-73H-110M148 73H110" stroke="#a5b5ff" stroke-width="2"/><g transform="translate(-120 -26)"><g fill="none" stroke="#a5b5ff" stroke-width="1.5" color="#a5b5ff"><path d="M0-30L25-20V3Q25 22 0 32Q-25 22-25 3V-20ZM-12 0L-2 10 15-10"/></g></g><text x="-70" y="-33" font-size="13" fill="#a5b5ff" text-anchor="start">06 / ADAPT</text><text x="-70" y="-10" font-size="9" fill="#a7b8ce" text-anchor="start">CONNECTED CAPABILITY</text><text x="0" y="29" font-size="14" fill="#edf3fd" text-anchor="middle">Autogenous · Dream Machine</text><text x="0" y="52" font-size="11" fill="#95a9c0" text-anchor="middle">Proposals and promotion boundaries</text></g><text x="30" y="640" font-size="11" fill="#a7b8ce" text-anchor="start">Explore each project for its own interfaces, maturity and evidence.</text><text x="1170" y="640" font-size="10" fill="#a7b8ce" text-anchor="end">MOTION IS DECORATIVE</text></svg>