<svg xmlns="http://www.w3.org/2000/svg" width="580" height="270" viewBox="0 0 580 270" role="img" aria-labelledby="title desc"><title id="title">RVF + RVM</title><desc id="desc">Portable state. Controlled execution.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#163047" stroke-opacity=".3"/></pattern><radialGradient id="halo"><stop stop-color="#233759"/><stop offset="1" stop-color="#080e19"/></radialGradient></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.signal{stroke-dasharray:3 13;animation:signal 5s linear infinite}.orbit{animation:turn 32s linear infinite;transform-box:fill-box;transform-origin:center}.reverse{animation-direction:reverse;animation-duration:47s}.pulse{animation:pulse 4s ease-in-out infinite}.draw{stroke-dasharray:900;animation:draw 9s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}@keyframes signal{to{stroke-dashoffset:-160}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}@keyframes draw{0%{stroke-dashoffset:900}60%,100%{stroke-dashoffset:0}}@keyframes float{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.sonar{animation:sonar 4s ease-out infinite;transform-origin:0 0}.layer{animation:layer 5s ease-in-out infinite}.route{stroke-dasharray:8 75;animation:route 3s linear infinite}.sweep{animation:turn 6s linear infinite;transform-origin:0 0}.gate{animation:gate 5s ease-in-out infinite}.scanline{animation:scanline 6s ease-in-out infinite}.glint{animation:glint 6s ease-in-out infinite}.satellite{animation:turn 9s linear infinite;transform-origin:0 0}.satellite.reverse{animation-direction:reverse;animation-duration:13s}
@keyframes sonar{0%{transform:scale(.4);opacity:0}20%{opacity:.7}100%{transform:scale(1.7);opacity:0}}
@keyframes layer{50%{transform:translateY(-6px)}}
@keyframes route{to{stroke-dashoffset:-166}}
@keyframes gate{0%,20%,85%,100%{opacity:.2}40%,65%{opacity:1}}
@keyframes scanline{0%,100%{transform:translateX(0);opacity:0}15%,85%{opacity:.5}90%{transform:translateX(230px);opacity:0}}
@keyframes glint{0%,25%,100%{opacity:.1}45%,65%{opacity:.8}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.sonar,.scanline{display:none}}
</style><rect width="580" height="270" rx="14" fill="#080e19"/><rect width="580" height="270" rx="14" fill="url(#grid)"/><path d="M20 20H48M20 20V48M560 250H532M560 250V222" fill="none" stroke="#9de8d0"/><text x="32" y="43" font-size="12" fill="#9de8d0" text-anchor="start">05 / CARRY AND EXECUTE</text><text x="32" y="94" font-size="32" fill="#edf3ff" text-anchor="start">RVF + RVM</text><text x="32" y="132" font-size="12" fill="#a7b8ce" text-anchor="start">Portable state. Controlled execution.</text><text x="32" y="243" font-size="12" fill="#9de8d0" text-anchor="start">EXPLORE PROJECT  ↗</text><g transform="translate(492 76)"><circle class="orbit" r="47" fill="none" stroke="#9de8d0" stroke-opacity=".5" stroke-dasharray="25 9 2 9"/><g fill="none" stroke="#9de8d0" stroke-width="1.5" color="#9de8d0"><g class="layer"><path d="M0-30L27-15V15L0 30-27 15V-15ZM-27-15L0 0 27-15M0 0V30"/><path class="signal" d="M0-30V0L-27 15"/><path class="gate" d="M0-30L27-15 0 0-27-15Z" fill="currentColor" fill-opacity=".2"/></g><ellipse class="pulse" cy="36" rx="33" ry="7"/></g></g><g stroke="#9de8d0" fill="none" opacity=".65"><path d="M34 194H120L148 170H240L270 204H380L408 178H548" stroke-opacity=".2"/><path class="route" style="animation-delay:-1.6s" d="M34 194H120L148 170H240L270 204H380L408 178H548"/><path d="M34 211H166L192 187H320L348 221H548" stroke-opacity=".2"/><circle class="gate" style="animation-delay:-0.0s" cx="120" cy="194" r="3" fill="#9de8d0"/><circle class="gate" style="animation-delay:-0.8s" cx="240" cy="170" r="3" fill="#9de8d0"/><circle class="gate" style="animation-delay:-1.6s" cx="380" cy="204" r="3" fill="#9de8d0"/><circle class="gate" style="animation-delay:-2.4000000000000004s" cx="548" cy="178" r="3" fill="#9de8d0"/></g><g transform="translate(492 76)"><g class="satellite"><circle cx="54" r="2.5" fill="#9de8d0"/></g><g class="satellite reverse"><circle cy="-57" r="1.8" fill="#edf3ff"/></g></g><path d="M260 239H548" stroke="#26364a"/><path class="signal" style="animation-delay:-4s" d="M260 239H548" stroke="#9de8d0"/></svg>