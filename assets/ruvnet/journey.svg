<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="132" viewBox="0 0 1200 132" role="img" aria-labelledby="title desc"><title id="title">From signal to useful work</title><desc id="desc">Perceive / remember / coordinate / execute / evaluate</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#163047" stroke-opacity=".3"/></pattern><radialGradient id="halo"><stop stop-color="#233759"/><stop offset="1" stop-color="#080e19"/></radialGradient><linearGradient id="sheen"><stop stop-color="#9de8d0" stop-opacity="0"/><stop offset=".5" stop-color="#d5eaff"/><stop offset="1" stop-color="#a5b5ff" stop-opacity="0"/></linearGradient><clipPath id="panelclip"><rect width="1200" height="132" rx="14"/></clipPath></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.signal{stroke-dasharray:3 13;animation:signal 5s linear infinite}.orbit{animation:turn 32s linear infinite;transform-box:fill-box;transform-origin:center}.reverse{animation-direction:reverse;animation-duration:47s}.pulse{animation:pulse 4s ease-in-out infinite}.draw{stroke-dasharray:900;animation:draw 9s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}@keyframes signal{to{stroke-dashoffset:-160}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}@keyframes draw{0%{stroke-dashoffset:900}60%,100%{stroke-dashoffset:0}}@keyframes float{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.sonar{animation:sonar 4s ease-out infinite;transform-origin:0 0}.layer{animation:layer 5s ease-in-out infinite}.route{stroke-dasharray:8 75;animation:route 3s linear infinite}.sweep{animation:turn 6s linear infinite;transform-origin:0 0}.gate{animation:gate 5s ease-in-out infinite}.scanline{animation:scanline 6s ease-in-out infinite}.glint{animation:glint 6s ease-in-out infinite}.satellite{animation:turn 9s linear infinite;transform-origin:0 0}.satellite.reverse{animation-direction:reverse;animation-duration:13s}
@keyframes sonar{0%{transform:scale(.4);opacity:0}20%{opacity:.7}100%{transform:scale(1.7);opacity:0}}
@keyframes layer{50%{transform:translateY(-6px)}}
@keyframes route{to{stroke-dashoffset:-166}}
@keyframes gate{0%,20%,85%,100%{opacity:.2}40%,65%{opacity:1}}
@keyframes scanline{0%,100%{transform:translateX(0);opacity:0}15%,85%{opacity:.5}90%{transform:translateX(230px);opacity:0}}
@keyframes glint{0%,25%,100%{opacity:.1}45%,65%{opacity:.8}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.sonar,.scanline{display:none}}

.edgeglow{stroke-dasharray:10 90;animation:edgeglow 9s linear infinite}.sheen{animation:sheen 11s ease-in-out infinite;opacity:0}.iconhalo{animation:iconhalo 5s ease-in-out infinite}.beacon{animation:beacon 4s ease-in-out infinite}.chevron{animation:chevron 3s ease-in-out infinite}.highlight{animation:highlight 6s ease-in-out infinite}
@keyframes edgeglow{to{stroke-dashoffset:-100}}
@keyframes sheen{0%,15%{transform:translateX(-200px);opacity:0}25%{opacity:.07}65%{transform:translateX(var(--travel));opacity:.07}75%,100%{transform:translateX(var(--travel));opacity:0}}
@keyframes iconhalo{50%{opacity:.18}}
@keyframes beacon{50%{opacity:.35}}
@keyframes chevron{50%{transform:translateX(5px)}}
@keyframes highlight{0%,100%{stroke-opacity:.2}50%{stroke-opacity:.8}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.sheen,.edgeglow{display:none}}
</style><rect width="1200" height="132" rx="14" fill="#080e19"/><rect width="1200" height="132" rx="14" fill="url(#grid)"/><g clip-path="url(#panelclip)" aria-hidden="true"><rect class="sheen" opacity="0" style="--travel:1400px" x="-180" width="180" height="132" fill="url(#sheen)"/><rect class="edgeglow" x="1" y="1" width="1198" height="130" rx="14" pathLength="100" stroke="#9de8d0" stroke-opacity=".55" fill="none"/></g><path d="M24 112H1176" stroke="#23334c"/><path class="signal" d="M24 112H1176" stroke="#f6a675"/><text x="28" y="38" font-size="11" fill="#f6a675" text-anchor="start">RUVNET / 02</text><text x="28" y="72" font-size="27" fill="#ecf3ff" text-anchor="start">From signal to useful work</text><text x="28" y="96" font-size="12" fill="#a7b8ce" text-anchor="start">Perceive / remember / coordinate / execute / evaluate</text><g transform="translate(1100 62)"><circle r="46" stroke="#f6a675" stroke-opacity=".15" fill="none"/><g class="orbit"><circle r="42" stroke="#f6a675" stroke-dasharray="40 15 2 15" fill="none"/></g><g fill="none" stroke="#f6a675" stroke-width="1.5" color="#f6a675"><circle class="iconhalo" r="39" fill="currentColor" fill-opacity=".06" stroke="none"/><circle r="25"/><circle r="16" stroke-dasharray="3 6"/><path d="M-32 0H32M0-32V32M0 0L22-22"/><circle cx="13" cy="-12" r="3" fill="currentColor"/><circle class="sonar" r="25"/><circle class="sonar" style="animation-delay:-2s" r="25"/><g class="sweep"><path d="M0 0L29-18A34 34 0 0 1 34 0Z" fill="currentColor" fill-opacity=".2" stroke="none"/></g></g></g></svg>