<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="132" viewBox="0 0 1200 132" role="img" aria-labelledby="title desc"><title id="title">From signal to useful work</title><desc id="desc">Perceive / remember / coordinate / execute / evaluate</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#163047" stroke-opacity=".3"/></pattern><radialGradient id="halo"><stop stop-color="#233759"/><stop offset="1" stop-color="#080e19"/></radialGradient></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.signal{stroke-dasharray:3 13;animation:signal 5s linear infinite}.orbit{animation:turn 32s linear infinite;transform-box:fill-box;transform-origin:center}.reverse{animation-direction:reverse;animation-duration:47s}.pulse{animation:pulse 4s ease-in-out infinite}.draw{stroke-dasharray:900;animation:draw 9s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}@keyframes signal{to{stroke-dashoffset:-160}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}@keyframes draw{0%{stroke-dashoffset:900}60%,100%{stroke-dashoffset:0}}@keyframes float{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="132" rx="14" fill="#080e19"/><rect width="1200" height="132" rx="14" fill="url(#grid)"/><path d="M24 112H1176" stroke="#23334c"/><path class="signal" d="M24 112H1176" stroke="#f6a675"/><text x="28" y="38" font-size="11" fill="#f6a675" text-anchor="start">RUVNET / 02</text><text x="28" y="72" font-size="27" fill="#ecf3ff" text-anchor="start">From signal to useful work</text><text x="28" y="96" font-size="12" fill="#a7b8ce" text-anchor="start">Perceive / remember / coordinate / execute / evaluate</text><g transform="translate(1100 62)"><circle r="46" stroke="#f6a675" stroke-opacity=".15" fill="none"/><g class="orbit"><circle r="42" stroke="#f6a675" stroke-dasharray="40 1