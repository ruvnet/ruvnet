<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Inside the capability loop</title><desc id="desc">Illustrated memory, coordination and evaluation roles. Motion is decorative, not measured system activity.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#163047" stroke-opacity=".3"/></pattern><radialGradient id="halo"><stop stop-color="#233759"/><stop offset="1" stop-color="#080e19"/></radialGradient><linearGradient id="sheen"><stop stop-color="#9de8d0" stop-opacity="0"/><stop offset=".5" stop-color="#d5eaff"/><stop offset="1" stop-color="#a5b5ff" stop-opacity="0"/></linearGradient><clipPath id="panelclip"><rect width="1200" height="400" rx="14"/></clipPath></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.signal{stroke-dasharray:3 13;animation:signal 5s linear infinite}.orbit{animation:turn 32s linear infinite;transform-box:fill-box;transform-origin:center}.reverse{animation-direction:reverse;animation-duration:47s}.pulse{animation:pulse 4s ease-in-out infinite}.draw{stroke-dasharray:900;animation:draw 9s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}@keyframes signal{to{stroke-dashoffset:-160}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}@keyframes draw{0%{stroke-dashoffset:900}60%,100%{stroke-dashoffset:0}}@keyframes float{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.sonar{animation:sonar 4s ease-out infinite;transform-origin:0 0}.layer{animation:layer 5s ease-in-out infinite}.route{stroke-dasharray:8 75;animation:route 3s linear infinite}.sweep{animation:turn 6s linear infinite;transform-origin:0 0}.gate{animation:gate 5s ease-in-out infinite}.scanline{animation:scanline 6s ease-in-out infinite}.glint{animation:glint 6s ease-in-out infinite}.satellite{animation:turn 9s linear infinite;transform-origin:0 0}.satellite.reverse{animation-direction:reverse;animation-duration:13s}
@keyframes sonar{0%{transform:scale(.4);opacity:0}20%{opacity:.7}100%{transform:scale(1.7);opacity:0}}
@keyframes layer{50%{transform:translateY(-6px)}}
@keyframes route{to{stroke-dashoffset:-166}}
@keyframes gate{0%,20%,85%,100%{opacity:.2}40%,65%{opacity:1}}
@keyframes scanline{0%,100%{transform:translateX(0);opacity:0}15%,85%{opacity:.5}90%{transform:translateX(230px);opacity:0}}
@keyframes glint{0%,25%,100%{opacity:.1}45%,65%{opacity:.8}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.sonar,.scanline{display:none}}

.edgeglow{stroke-dasharray:10 90;animation:edgeglow 9s linear infinite}.sheen{animation:sheen 11s ease-in-out infinite;opacity:0}.iconhalo{animation:iconhalo 5s ease-in-out infinite}.beacon{animation:beacon 4s ease-in-out infinite}.chevron{animation:chevron 3s ease-in-out infinite}.highlight{animation:highlight 6s ease-in-out infinite}
@keyframes edgeglow{to{stroke-dashoffset:-100}}
@keyframes sheen{0%,15%{transform:translateX(-200px);opacity:0}25%{opacity:.07}65%{transform:translateX(var(--travel));opacity:.07}75%,100%{transform:translateX(var(--travel));opacity:0}}
@keyframes iconhalo{50%{opacity:.18}}
@keyframes beacon{50%{opacity:.35}}
@keyframes chevron{50%{transform:translateX(5px)}}
@keyframes highlight{0%,100%{stroke-opacity:.2}50%{stroke-opacity:.8}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.sheen,.edgeglow{display:none}}
</style><rect width="1200" height="400" rx="14" fill="#080e19"/><rect width="1200" height="400" rx="14" fill="url(#grid)"/><g clip-path="url(#panelclip)" aria-hidden="true"><rect class="sheen" opacity="0" style="--travel:1400px" x="-180" width="180" height="400" fill="url(#sheen)"/><rect class="edgeglow" x="1" y="1" width="1198" height="398" rx="14" pathLength="100" stroke="#9de8d0" stroke-opacity=".55" fill="none"/></g><text x="30" y="36" font-size="16" fill="#edf3ff" text-anchor="start">INSIDE THE CAPABILITY LOOP</text><text x="1170" y="36" font-size="11" fill="#a7b8ce" text-anchor="end">CONCEPTUAL CUTAWAY</text><rect x="30" y="64" width="350" height="300" rx="14" fill="#0c1625" stroke="#263a51"/><g transform="translate(205 205)"><ellipse rx="134" ry="73" fill="url(#halo)" stroke="#263a51"/><ellipse class="pulse" rx="112" ry="56" fill="none" stroke="#9de8d0" stroke-opacity=".3"/><g transform="scale(2.0)"><g fill="none" stroke="#9de8d0" stroke-width="1.5" color="#9de8d0"><g class="layer"><circle class="iconhalo" r="39" fill="currentColor" fill-opacity=".06" stroke="none"/><path d="M-28-12L0-27 28-12 0 3ZM-28-2L0 13 28-2M-28 9L0 24 28 9M-28 20L0 35 28 20"/><path class="signal" d="M0-27V35"/></g><path class="route" d="M-28 20L0 35 28 20M-28-12L0-27 28-12" stroke-width="3"/><circle class="gate" cy="4" r="4" fill="currentColor"/></g></g><g class="satellite"><circle cx="102" r="4" fill="#9de8d0"/><circle cx="-102" r="2" fill="#9de8d0"/></g></g><text x="52" y="95" font-size="13" fill="#9de8d0" text-anchor="start">01 / MEMORY</text><text x="205" y="321" font-size="20" fill="#edf3ff" text-anchor="middle">Retain context</text><path class="route" d="M380 211H425" fill="none" stroke="#9de8d0" stroke-width="2"/><rect x="425" y="64" width="350" height="300" rx="14" fill="#0c1625" stroke="#263a51"/><g transform="translate(600 205)"><ellipse rx="134" ry="73" fill="url(#halo)" stroke="#263a51"/><ellipse class="pulse" rx="112" ry="56" fill="none" stroke="#a5b5ff" stroke-opacity=".3"/><g transform="scale(2.0)"><g fill="none" stroke="#a5b5ff" stroke-width="1.5" color="#a5b5ff"><circle class="iconhalo" r="39" fill="currentColor" fill-opacity=".06" stroke="none"/><path d="M0-20V0M0 0L-26 23M0 0L26 23M-26 23H26"/><circle cy="-24" r="7"/><circle cx="-26" cy="23" r="7"/><circle cx="26" cy="23" r="7"/><circle r="5"/><path class="route" d="M0-24V0L-26 23H26L0 0" stroke-width="3"/><circle class="sonar" r="12"/><circle class="gate" cx="26" cy="23" r="4" fill="currentColor"/></g></g><g class="satellite"><circle cx="102" r="4" fill="#a5b5ff"/><circle cx="-102" r="2" fill="#a5b5ff"/></g></g><text x="447" y="95" font-size="13" fill="#a5b5ff" text-anchor="start">02 / COORDINATION</text><text x="600" y="321" font-size="20" fill="#edf3ff" text-anchor="middle">Route the work</text><path class="route" d="M775 211H820" fill="none" stroke="#a5b5ff" stroke-width="2"/><rect x="820" y="64" width="350" height="300" rx="14" fill="#0c1625" stroke="#263a51"/><g transform="translate(995 205)"><ellipse rx="134" ry="73" fill="url(#halo)" stroke="#263a51"/><ellipse class="pulse" rx="112" ry="56" fill="none" stroke="#f6a675" stroke-opacity=".3"/><g transform="scale(2.0)"><g fill="none" stroke="#f6a675" stroke-width="1.5" color="#f6a675"><circle class="iconhalo" r="39" fill="currentColor" fill-opacity=".06" stroke="none"/><path d="M-28-27V27H30M-20 14L-8 2 4 8 25-16"/><circle cx="25" cy="-16" r="6"/><path d="M-20-20H5M-20-12H-4"/><path class="route" d="M-20 14L-8 2 4 8 25-16" stroke-width="3"/><circle class="sonar" cx="25" cy="-16" r="8"/></g></g><g class="satellite"><circle cx="102" r="4" fill="#f6a675"/><circle cx="-102" r="2" fill="#f6a675"/></g></g><text x="842" y="95" font-size="13" fill="#f6a675" text-anchor="start">03 / EVALUATION</text><text x="995" y="321" font-size="20" fill="#edf3ff" text-anchor="middle">Inspect the outcome</text><text x="30" y="388" font-size="11" fill="#a7b8ce" text-anchor="start">Roles connect the story. Each project documents its own supported interfaces.</text></svg>