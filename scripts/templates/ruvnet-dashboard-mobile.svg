<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1080" viewBox="0 0 320 720" role="img" aria-labelledby="title desc">
  <title id="title">rUv ecosystem statistics</title>
  <desc id="desc"/>
  <style>
    text { font-family: system-ui, sans-serif; fill: #eef3fa; font-size: 16.5px; font-variant-numeric: tabular-nums }
    .section { font-size: 19px; font-weight: 650 }
    .note { fill: #b4c4d4 }
    .label { fill: #9de8d0; font-weight: 600 }
    .count { font-size: 24px; font-weight: 680 }
    .number { fill: #eef3fa; font-weight: 650 }
    .change { fill: #b4c4d4 }
    .rule { fill: none; stroke: #2a3849 }
    .pulse { transform-box: fill-box; transform-origin: center }
    @media (prefers-reduced-motion: no-preference) {
      .pulse { animation: ripple 3s ease-out infinite }
      @keyframes ripple { from { transform: scale(.5); opacity: .8 } to { transform: scale(1.5); opacity: 0 } }
    }
  </style>
  <defs>
    <linearGradient id="area-fill" x2="0" y2="1">
      <stop stop-color="#f8a76d" stop-opacity=".26"/>
      <stop offset="1" stop-color="#f8a76d" stop-opacity=".02"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="319" height="719" rx="14" fill="#0a101a" stroke="#2a3849"/>
  <path d="M16 23v12" stroke="#9de8d0" stroke-width="3" stroke-linecap="round"/>
  <text x="26" y="35" class="section">rUv / Ecosystem</text>

  <text x="16" y="65" class="label" id="npm-observed-label"/>
  <text x="14" y="108" style="font-size:39px;font-weight:720;fill:#ffae73" id="npm-observed-total"/>
  <text x="16" y="135" class="note" id="npm-observed-basis"/>
  <text x="16" y="157" class="note" id="npm-through"/>

  <path class="rule" d="M16 170H304 M16 284H304 M16 429H304 M16 579H304"/>
  <text x="16" y="194" class="section">GitHub</text>
  <text x="304" y="194" text-anchor="end" class="note" id="github-date"/>
  <text x="16" y="217" class="note">Nonfork stars</text>
  <text x="143" y="217" class="note">Repos</text>
  <text x="304" y="217" text-anchor="end" class="note">Followers</text>
  <text x="16" y="247" class="count" style="fill:#b7c2ff" id="github-stars"/>
  <text x="143" y="247" class="count" id="github-repos"/>
  <text x="304" y="247" text-anchor="end" class="count" style="fill:#9de8d0" id="github-followers"/>
  <text x="16" y="273" class="note" id="github-cohort"/>

  <text x="16" y="309" class="label" id="npm-history-label" textLength="288" lengthAdjust="spacingAndGlyphs"/>
  <text x="16" y="331" class="note" id="chart-basis"/>
  <path class="rule" d="M70 347H299 M70 385H299"/>
  <text x="61" y="352" text-anchor="end" class="note" id="chart-ceiling"/>
  <text x="61" y="390" text-anchor="end" class="note">0</text>
  <path id="history-area" fill="url(#area-fill)"/>
  <path id="history-line" fill="none" stroke="#ffae73" stroke-width="2.5" stroke-linejoin="round"/>
  <circle id="history-halo" class="pulse" r="4" fill="none" stroke="#ffae73"/>
  <circle id="history-end" r="2.5" fill="#ffcf9e"/>
  <text x="16" y="412" class="note" id="history-start"/>
  <text x="304" y="412" class="note" text-anchor="end" id="history-through"/>

  <text x="16" y="453" class="note" id="crates-observed-total">Crates.io cumulative: <tspan x="304" text-anchor="end" class="number"/></text>
  <text x="16" y="475" class="note" id="release-assets-observed-total">Release assets observed: <tspan x="304" text-anchor="end" class="number"/></text>
  <text x="16" y="505" class="label" id="npm-latest-complete-total">Latest complete npm day: <tspan x="16" y="537" class="count number"/></text>
  <text x="16" y="562" class="note" id="npm-latest-complete-date" textLength="288" lengthAdjust="spacingAndGlyphs"/>

  <text x="16" y="607" class="section">Repo stars</text>
  <text x="304" y="606" class="note" text-anchor="end" id="stars-since"/>
  <g id="project-stars"/>
</svg>
